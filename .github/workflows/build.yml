name: Build and push worker image

# Builds the serverless worker image on GitHub's runners and pushes it to
# GHCR. This deliberately replaces RunPod's own GitHub-integration builder,
# whose build queue can sit in "waiting for build" indefinitely. The endpoint
# then runs a plain image reference, which the RunPod REST API can set
# directly — no console build step involved.
# Manual-only for now: the primary deploy path is RunPod's own GitHub
# integration. This is the fallback for when that build queue stalls —
# run it from the Actions tab, then point the endpoint at the GHCR image.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The CUDA base plus torch overflows the ~14GB free on a stock runner.
      # Dropping toolchains we don't use reclaims roughly 20-30GB.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "After:"; df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the endpoint tracks; the sha tag pins a rollback target.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache keeps rebuilds cheap when only handler.py changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed tags
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}"
